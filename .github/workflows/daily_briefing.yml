name: Daily Financial Briefing

on:
  schedule:
    # 22:15 UTC Sun-Fri = 台灣 06:15 週一到週六（週日由週報接手）。
    # 2026-08-17 起 GitHub cron 為主、Render trigger.py 為備援；下方
    # 「Skip if already sent today」保證兩者同日只寄一封。
    - cron: "15 22 * * 0-5"
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  dedup:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if already sent today (Taipei date)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          # 台灣日期 = UTC 前一日 16:00 起；抓 24h 內的成功 run，再用台灣日期過濾
          SINCE=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily_briefing.yml \
                   --status success --created ">=$SINCE" --json createdAt,databaseId \
                   --jq "[.[] | select(.databaseId != ${{ github.run_id }})
                          | select((.createdAt | fromdateiso8601 + 8*3600 | strftime(\"%Y-%m-%d\")) == \"$TODAY\")] | length")
          echo "successful runs already today (Taipei $TODAY): $DONE"
          if [ "$DONE" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  send-briefing:
    needs: dedup
    if: needs.dedup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 2026-08-17：30 → 45 分。Claude Code 主路徑逾時（600s）後還要留時間給 Gemini fallback。
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl pandas numpy yfinance --upgrade

      # 2026-08-17：AI 生成主路徑改走 Claude Code headless（Max 訂閱，不耗 API 額度）。
      # 認證用 CLAUDE_CODE_OAUTH_TOKEN secret（本機 `claude setup-token` 產生，會過期）。
      # 裝不起來或 token 失效時 ai_processor.py 會自動 fallback 到 Gemini，日報照出。
      - name: Install Claude Code CLI
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run morning briefing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
        run: |
          cd briefing
          python main.py

      - name: Publish briefing to GitHub Pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          HTML_FILE=briefing/output/briefing.html

          if [ ! -f "$HTML_FILE" ]; then
            echo "No HTML output found, skipping publish"
            exit 0
          fi

          # Clone financial-analysis-bot
          git clone https://x-access-token:${GH_PAT}@github.com/keigoks-ivan/financial-analysis-bot.git /tmp/fab
          cd /tmp/fab

          # Copy multi-page HTML files generated by main.py
          mkdir -p docs/briefing
          PAGES_DIR="${GITHUB_WORKSPACE}/docs/briefing"
          if [ -d "$PAGES_DIR" ] && [ "$(ls -A $PAGES_DIR 2>/dev/null)" ]; then
            cp "$PAGES_DIR"/*.html docs/briefing/
            echo "Copied $(ls docs/briefing/*.html | wc -l) pages from build"
          else
            echo "No multi-page output found, falling back to single-page"
            cp "${GITHUB_WORKSPACE}/${HTML_FILE}" docs/briefing/index.html
          fi

          # Daily archive copy
          cp docs/briefing/index.html "docs/briefing/${TODAY}.html"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📰 Morning briefing ${TODAY}"
          git push
